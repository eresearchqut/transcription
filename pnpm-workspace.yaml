packages:
  - "model"
  - "api"
  - "deployment"
  - "frontend"

overrides:
  # frontend: @splunk/otel-web -> @opentelemetry/otlp-transformer
  protobufjs: "^7.6.1"
  # api: express (router) and aws-sdk-client-mock (sinon -> nise)
  path-to-regexp: "^8.4.2"
  # frontend: storybook (all @storybook/* addons)
  ws: "^8.21.0"
  # frontend: @storybook/nextjs -> react-docgen-typescript-plugin -> flat-cache
  flatted: "^3.4.2"
  # frontend: @storybook/* -> webpack/schema-utils -> ajv
  fast-uri: "^3.1.2"
  # frontend: @storybook/nextjs and @storybook/cli -> @babel/preset-env
  "@babel/plugin-transform-modules-systemjs": "^7.29.4"
  # root: rimraf -> glob; api: jest -> glob/test-exclude
  "minimatch@<3.1.4": "^3.1.5"
  "minimatch@>=9.0.0 <9.0.7": "^9.0.7"
  # api: jest/@types/jest/aws-sdk-client-mock-jest -> micromatch, jest-util, anymatch
  "picomatch@<2.3.2": "^2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "^4.0.4"
