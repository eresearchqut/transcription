name: Integration
on:
  pull_request:
  workflow_dispatch:

# The suite deploys a stack and polls it, so a superseded run has nothing worth
# finishing.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Evaluate IAM, so a handler missing a grant fails the suite. See the
      # AUTH setting in docker-compose.yml for why local development doesn't.
      MINISTACK_AUTH: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      # MiniStack runs each invocation in a sibling container, so the Lambda
      # runtimes are otherwise pulled on first use. Fetching them up front, with
      # the rest of the stack's images, keeps the download out of the suite's
      # own chain timeouts. The cache-only profile adds the runtime images
      # declared in docker-compose.yml.
      - name: Pre-pull images
        run: docker compose --profile cache-only pull --quiet --ignore-buildable

      - name: Start the local stack
        run: pnpm ministack:up

      # The stack outputs carry the Cognito and API identifiers the suite signs
      # in with, so write them out the same way `pnpm dev` does.
      - name: Write the frontend environment
        run: pnpm ministack:env

      - name: Run the integration suite
        run: pnpm test:integration

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Stop the stack
        if: always()
        run: docker compose down -v
