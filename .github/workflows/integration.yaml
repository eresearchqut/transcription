name: Integration
on:
  pull_request:
    paths:
      - 'api/**'
      - 'model/**'
      - 'deployment/lib/**'
      - 'deployment/bin/**'
      - 'deployment/config/**'
      - 'docker-compose.yml'
      - 'scripts/ministack/**'
      - '.github/workflows/integration.yaml'
  workflow_dispatch:

# The suite deploys a stack and polls it, so a superseded run has nothing worth
# finishing.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned rather than the `latest` docker-compose.yml defaults to, so an
      # upstream release cannot turn a green build red with no commit here.
      # 1.5.10 is the floor the suite needs, for Translate and COGNITO_USER_POOLS
      # enforcement on REST APIs; 1.5.11 is what this job has been verified
      # against. Bump it deliberately.
      MINISTACK_IMAGE: ministackorg/ministack:1.5.11
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      # MiniStack runs each invocation in a sibling container, and the CDK's
      # bucket notification custom resource is a Python function, so both
      # runtimes are pulled on first use. Fetching them up front keeps a ~1.4GB
      # download out of the suite's own chain timeouts.
      - name: Pre-pull runtime images
        run: |
          docker pull --quiet "$MINISTACK_IMAGE" &
          docker pull --quiet public.ecr.aws/lambda/nodejs:24 &
          docker pull --quiet public.ecr.aws/lambda/python:3.13 &
          wait

      - name: Start the local stack
        run: docker compose up -d --build

      # `docker compose up` returns once MiniStack is healthy, while cdklocal is
      # still deploying. This polls CloudFormation for the stack outputs, which
      # is the same gate `pnpm dev` uses, so there is one implementation of the
      # wait rather than a second one here.
      - name: Wait for the deploy
        run: pnpm ministack:env

      - name: Run the integration suite
        run: pnpm test:integration

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Stop the stack
        if: always()
        run: docker compose down -v
