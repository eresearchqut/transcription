services:
  transcription-ministack:
    container_name: "${TRANSCRIPTION_MINISTACK_DOCKER_NAME:-transcription-ministack}"
    privileged: true
    # Override MINISTACK_IMAGE to pin a release or a locally-built image.
    image: ${MINISTACK_IMAGE:-ministackorg/ministack:latest}
    ports:
      # Loopback only: the emulator is unauthenticated and this container has
      # the Docker socket. MINISTACK_BIND_HOST=0.0.0.0 opens it to another
      # device on a trusted network.

      # Not the standard 4566, so this stack can run alongside other local
      # emulators. MiniStack builds container-facing URLs from the in-container
      # GATEWAY_PORT and assumes the host publishes the same port, which the
      # two settings below compensate for.
      - "${MINISTACK_BIND_HOST:-127.0.0.1}:24566:4566"
    environment:
      - MINISTACK_REGION=ap-southeast-2
      # Run each invocation in a sibling container on the shared network so the
      # handlers can reach the gateway. The default warm executor stubs only
      # the modules it knows about, and NodejsFunction marks the AWS SDK
      # external. X-Ray is unavailable under this executor: see
      # TolerateMissingXrayDaemon in deployment/lib/api-stack.ts.
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_DOCKER_NETWORK=transcription-network
      # The endpoint handed to Lambda containers. Defaults to
      # host.docker.internal:4566, where nothing is listening.
      - AWS_ENDPOINT_URL=http://transcription-ministack:4566
      # The host used to build CloudFormation custom resource ResponseURLs.
      # Defaults to localhost, which a Lambda container cannot reach.
      - MINISTACK_HOST=transcription-ministack
      # Any OpenAI-compatible /chat/completions endpoint (Ollama, llama.cpp,
      # vLLM) for real summaries. Unset, or unreachable, Bedrock answers with a
      # canned reply.
      - MINISTACK_BEDROCK_PROXY_URL=${MINISTACK_BEDROCK_PROXY_URL:-}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      # /_ministack/ready returns 200 only once the gateway is serving. The
      # image ships python3 but not curl.
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/ready')
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40
    networks:
      transcription-network:
        aliases:
          # cdklocal addresses the CDK asset bucket virtual-host style during
          # publish and ignores AWS_S3_FORCE_PATH_STYLE there. The name is
          # deterministic locally, so resolve the subdomain to the gateway.
          - cdk-hnb659fds-assets-000000000000-ap-southeast-2.transcription-ministack

  # Paces the emulated Transcribe and Translate jobs, which otherwise finish
  # faster than the pending states the UI polls for can be seen. The gateway
  # holds these in memory, so this runs on every `up` and exits. Translation
  # sits above the emulator's default so a transcription arrives before its
  # translation does.
  transcription-job-pace:
    container_name: "${TRANSCRIPTION_JOB_PACE_DOCKER_NAME:-transcription-job-pace}"
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "-c"]
    # The endpoint answers 200 whether or not it recognised a key, so the
    # response is the only evidence these still exist.
    command:
      - >
        curl --fail --silent --show-error --request POST
        http://transcription-ministack:4566/_ministack/config
        --header 'content-type: application/json'
        --data '{"transcribe._JOB_RUN_SECONDS": ${TRANSCRIBE_JOB_RUN_SECONDS:-2}, "translate._JOB_RUN_SECONDS": ${TRANSLATE_JOB_RUN_SECONDS:-5}}'
        | tee /dev/stderr
        | grep -q '"transcribe._JOB_RUN_SECONDS".*"translate._JOB_RUN_SECONDS"'
    depends_on:
      transcription-ministack:
        condition: service_healthy
    networks:
      - transcription-network

  # Terminates TLS in front of the Cognito hosted UI. Amplify hardcodes the
  # hosted UI scheme to https and the gateway serves plain http on a single
  # port, so without this the frontend cannot sign in the way a deployed
  # environment does.
  transcription-auth-proxy:
    container_name: "${TRANSCRIPTION_AUTH_PROXY_DOCKER_NAME:-transcription-auth-proxy}"
    image: caddy:2-alpine
    ports:
      # Loopback by default for the same reason as the gateway, and because the
      # certificate is issued for localhost and matches nothing else.
      - "${MINISTACK_BIND_HOST:-127.0.0.1}:24443:24443"
    volumes:
      - "./scripts/ministack/Caddyfile:/etc/caddy/Caddyfile:ro"
      # Holds the generated certificate authority. Without it a restart issues
      # a new one and the developer has to trust it again.
      - "transcription-caddy-data:/data"
    healthcheck:
      test: "wget --quiet --no-check-certificate --output-document=/dev/null https://localhost:24443/_healthz"
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    depends_on:
      transcription-ministack:
        condition: service_healthy
    networks:
      - transcription-network

  # Deploys the CDK app once MiniStack is healthy, then watches for Lambda code
  # changes.
  transcription-bootstrap:
    container_name: "${TRANSCRIPTION_BOOTSTRAP_DOCKER_NAME:-transcription-bootstrap}"
    build:
      context: .
      dockerfile: scripts/ministack/Dockerfile
    volumes:
      - ".:/app"
      # pnpm links native binaries (notably esbuild, which the CDK uses to
      # bundle the handlers) for the host platform, so the container installs
      # its own dependencies into these volumes rather than reusing the
      # bind-mounted tree. `model/dist` is a volume for the same reason it is
      # built here at all: the container runs as root, and a build output
      # written back through the bind mount either lands root-owned in the
      # working tree or races the host's own `pnpm --filter model build`.
      - "transcription-root-modules:/app/node_modules"
      - "transcription-api-modules:/app/api/node_modules"
      - "transcription-deployment-modules:/app/deployment/node_modules"
      - "transcription-model-modules:/app/model/node_modules"
      - "transcription-model-dist:/app/model/dist"
      - "transcription-pnpm-store:/pnpm-store"
    # `model` resolves to its compiled `dist`, and nothing else in the startup
    # path builds it, so esbuild cannot bundle the handlers on a clean checkout
    # until it has been built here. Synthesis goes to /tmp rather than
    # deployment/cdk.out, so the container never writes a cloud assembly into
    # the bind-mounted tree or deletes one the host synthesised.
    # `pnpm ministack:deploy` synthesises to /tmp/cdk.out.deploy instead,
    # because the watch process below holds this one for as long as it runs.
    command: >
      bash -c "cd /app &&
               rm -f /tmp/deploy-complete &&
               pnpm install --frozen-lockfile --filter deployment... --filter api... &&
               pnpm --filter 'api^...' build &&
               cd deployment &&
               rm -rf /tmp/cdk.out &&
               cdklocal bootstrap --output /tmp/cdk.out &&
               cdklocal deploy --all --require-approval never --output /tmp/cdk.out &&
               touch /tmp/deploy-complete &&
               cdklocal watch --all --require-approval never --output /tmp/cdk.out"
    # The marker is cleared on start and written once the stack is deployed, so
    # `docker compose up --wait` blocks until the outputs belong to this run
    # rather than to the stack a previous run left behind.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/deploy-complete"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
    environment:
      # Use config/local.json, the default synthesizer and the local-safe stack.
      - LOCAL_DEPLOY=true
      # The host the browser reaches the emulator and the frontend on. Set it
      # to this machine's LAN address to open the app from a phone or another
      # machine, where localhost is that device rather than this one.
      - LOCAL_HOST=${LOCAL_HOST:-localhost}
      - AWS_ENDPOINT_URL=http://transcription-ministack:4566
      - AWS_ENDPOINT_URL_S3=http://transcription-ministack:4566
      # cdklocal publishes assets virtual-host style unless told otherwise, and
      # a Docker network name has no wildcard DNS, so asset publishing dies on
      # <bucket>.transcription-ministack.
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=ap-southeast-2
      - AWS_DEFAULT_REGION=ap-southeast-2
      # cdklocal strips every AWS_* var not listed here, so each one the
      # deploy and the Lambda containers need has to be allowlisted.
      - AWS_ENVAR_ALLOWLIST=AWS_DEFAULT_REGION,AWS_ENDPOINT_URL_S3,AWS_ENDPOINT_URL,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_FORCE_PATH_STYLE
    depends_on:
      transcription-ministack:
        condition: service_healthy
      # Not a real dependency. `docker compose up --wait` fails on a service
      # that exits unless something waits for it to complete.
      transcription-job-pace:
        condition: service_completed_successfully
    networks:
      - transcription-network

volumes:
  transcription-root-modules:
  transcription-api-modules:
  transcription-deployment-modules:
  transcription-model-modules:
  transcription-model-dist:
  transcription-pnpm-store:
  transcription-caddy-data:

networks:
  transcription-network:
    # Explicit name so LAMBDA_DOCKER_NETWORK can reference it independently of
    # the compose project name.
    name: transcription-network
